<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You&apos;re offline — Withink</title>
    <meta name="theme-color" content="#FAF7F2" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #26221c;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 24rem; }
      h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
      p { font-size: 1rem; line-height: 1.6; opacity: 0.75; }
      .dot { margin-bottom: 1.5rem; font-size: 1.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">✳</div>
      <h1>You&apos;re offline</h1>
      <p>
        Connect to the internet to open your diary. Your journal is end-to-end
        encrypted and never leaves your device without a connection.
      </p>
    </div>
  </body>
</html>
